services:
  live-h5:
    image: ghcr.io/kouleen/live-h5:latest
    container_name: live-h5
    ports:
      - "8887:80"
    networks:
      - live-h5-internal
  gateway:
    image: ghcr.io/kouleen/gateway:latest
    container_name: gateway
    ports:
      - "8888:8888"
    environment:
      - LISTEN_ADDR=${LISTEN_ADDR}
      - ETCD_ENDPOINTS=${ETCD_ENDPOINTS}
      - IDL_REPO_URL=${IDL_REPO_URL}
      - IDL_REPO_BRANCH=${IDL_REPO_BRANCH}
      - IDL_LOCAL_PATH=${IDL_LOCAL_PATH}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - REDIS_ADDR=${REDIS_ADDR}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB}
    volumes:
      - /root/.ssh:/root/.ssh:ro
    networks:
      - etcd-internal
      - mysql-internal
      - redis-internal

  user-center:
    image: ghcr.io/kouleen/user-center:latest
    container_name: user-center
    environment:
      - ETCD_ENDPOINTS=${ETCD_ENDPOINTS}
      - ADDRESS=${USER_ADDRESS}
      - REDIS_ADDR=${REDIS_ADDR}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB}
      - MYSQL_USERNAME=${MYSQL_USERNAME}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_DATABASE=${USER_MYSQL_DATABASE}
      - MYSQL_SLAVE1_USERNAME=${MYSQL_SLAVE1_USERNAME}
      - MYSQL_SLAVE1_PASSWORD=${MYSQL_SLAVE1_PASSWORD}
      - MYSQL_SLAVE1_HOST=${MYSQL_SLAVE1_HOST}
      - MYSQL_SLAVE1_PORT=${MYSQL_SLAVE1_PORT}
      - MYSQL_SLAVE1_DATABASE=${USER_MYSQL_SLAVE1_DATABASE}
      - MYSQL_SLAVE2_USERNAME=${MYSQL_SLAVE2_USERNAME}
      - MYSQL_SLAVE2_PASSWORD=${MYSQL_SLAVE2_PASSWORD}
      - MYSQL_SLAVE2_HOST=${MYSQL_SLAVE2_HOST}
      - MYSQL_SLAVE2_PORT=${MYSQL_SLAVE2_PORT}
      - MYSQL_SLAVE2_DATABASE=${USER_MYSQL_SLAVE2_DATABASE}
      - RABBITMQ_URL=${RABBITMQ_URL}
    networks:
      - etcd-internal
      - mysql-internal
      - redis-internal

  system-center:
    image: ghcr.io/kouleen/system-center:latest
    container_name: system-center
    environment:
      - ETCD_ENDPOINTS=${ETCD_ENDPOINTS}
      - ADDRESS=${SYSTEM_ADDRESS}
      - REDIS_ADDR=${REDIS_ADDR}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB}
      - MYSQL_USERNAME=${MYSQL_USERNAME}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_DATABASE=${SYSTEM_MYSQL_DATABASE}
      - MYSQL_SLAVE1_USERNAME=${MYSQL_SLAVE1_USERNAME}
      - MYSQL_SLAVE1_PASSWORD=${MYSQL_SLAVE1_PASSWORD}
      - MYSQL_SLAVE1_HOST=${MYSQL_SLAVE1_HOST}
      - MYSQL_SLAVE1_PORT=${MYSQL_SLAVE1_PORT}
      - MYSQL_SLAVE1_DATABASE=${SYSTEM_MYSQL_SLAVE1_DATABASE}
      - MYSQL_SLAVE2_USERNAME=${MYSQL_SLAVE2_USERNAME}
      - MYSQL_SLAVE2_PASSWORD=${MYSQL_SLAVE2_PASSWORD}
      - MYSQL_SLAVE2_HOST=${MYSQL_SLAVE2_HOST}
      - MYSQL_SLAVE2_PORT=${MYSQL_SLAVE2_PORT}
      - MYSQL_SLAVE2_DATABASE=${SYSTEM_MYSQL_SLAVE2_DATABASE}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - CLOUDFLARE_ACCESS_KEY_ID=${CLOUDFLARE_ACCESS_KEY_ID}
      - CLOUDFLARE_SECRET_ACCESS_KEY=${CLOUDFLARE_SECRET_ACCESS_KEY}
      - CLOUDFLARE_BUCKET=${CLOUDFLARE_BUCKET}
      - CLOUDFLARE_ENDPOINT=${CLOUDFLARE_ENDPOINT}
    networks:
      - etcd-internal
      - mysql-internal
      - redis-internal

  room-center:
    image: ghcr.io/kouleen/room-center:latest
    container_name: room-center
    environment:
      - ETCD_ENDPOINTS=${ETCD_ENDPOINTS}
      - ADDRESS=${ROOM_ADDRESS}
      - REDIS_ADDR=${REDIS_ADDR}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB}
      - MYSQL_USERNAME=${MYSQL_USERNAME}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_DATABASE=${ROOM_MYSQL_DATABASE}
      - MYSQL_SLAVE1_USERNAME=${MYSQL_SLAVE1_USERNAME}
      - MYSQL_SLAVE1_PASSWORD=${MYSQL_SLAVE1_PASSWORD}
      - MYSQL_SLAVE1_HOST=${MYSQL_SLAVE1_HOST}
      - MYSQL_SLAVE1_PORT=${MYSQL_SLAVE1_PORT}
      - MYSQL_SLAVE1_DATABASE=${ROOM_MYSQL_SLAVE1_DATABASE}
      - MYSQL_SLAVE2_USERNAME=${MYSQL_SLAVE2_USERNAME}
      - MYSQL_SLAVE2_PASSWORD=${MYSQL_SLAVE2_PASSWORD}
      - MYSQL_SLAVE2_HOST=${MYSQL_SLAVE2_HOST}
      - MYSQL_SLAVE2_PORT=${MYSQL_SLAVE2_PORT}
      - MYSQL_SLAVE2_DATABASE=${ROOM_MYSQL_SLAVE2_DATABASE}
      - RABBITMQ_URL=${RABBITMQ_URL}
    networks:
      - etcd-internal
      - mysql-internal
      - redis-internal


  workflow-center:
    image: ghcr.io/kouleen/workflow-center:latest
    container_name: workflow-center
    environment:
      - ETCD_ENDPOINTS=${ETCD_ENDPOINTS}
      - ADDRESS=${WORKFLOW_ADDRESS}
      - REDIS_ADDR=${REDIS_ADDR}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB}
      - MYSQL_USERNAME=${MYSQL_USERNAME}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_DATABASE=${WORKFLOW_MYSQL_DATABASE}
      - MYSQL_SLAVE1_USERNAME=${MYSQL_SLAVE1_USERNAME}
      - MYSQL_SLAVE1_PASSWORD=${MYSQL_SLAVE1_PASSWORD}
      - MYSQL_SLAVE1_HOST=${MYSQL_SLAVE1_HOST}
      - MYSQL_SLAVE1_PORT=${MYSQL_SLAVE1_PORT}
      - MYSQL_SLAVE1_DATABASE=${WORKFLOW_MYSQL_SLAVE1_DATABASE}
      - MYSQL_SLAVE2_USERNAME=${MYSQL_SLAVE2_USERNAME}
      - MYSQL_SLAVE2_PASSWORD=${MYSQL_SLAVE2_PASSWORD}
      - MYSQL_SLAVE2_HOST=${MYSQL_SLAVE2_HOST}
      - MYSQL_SLAVE2_PORT=${MYSQL_SLAVE2_PORT}
      - MYSQL_SLAVE2_DATABASE=${WORKFLOW_MYSQL_SLAVE2_DATABASE}
      - MYSQL_ADDR_LISTENER=${MYSQL_ADDR_LISTENER}
      - MYSQL_USER_LISTENER=${MYSQL_USER_LISTENER}
      - MYSQL_PASSWORD_LISTENER=${MYSQL_PASSWORD_LISTENER}
      - RABBITMQ_URL=${RABBITMQ_URL}
    networks:
      - etcd-internal
      - mysql-internal
      - redis-internal

  payment-center:
