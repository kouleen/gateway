    container_name: gift-center
    environment:
      - ETCD_ENDPOINTS=${ETCD_ENDPOINTS}
      - ADDRESS=${GIFT_ADDRESS}
      - REDIS_ADDR=${REDIS_ADDR}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB}
      - MYSQL_USERNAME=${MYSQL_USERNAME}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_DATABASE=${GIFT_MYSQL_DATABASE}
      - MYSQL_SLAVE1_USERNAME=${MYSQL_SLAVE1_USERNAME}
      - MYSQL_SLAVE1_PASSWORD=${MYSQL_SLAVE1_PASSWORD}
      - MYSQL_SLAVE1_HOST=${MYSQL_SLAVE1_HOST}
      - MYSQL_SLAVE1_PORT=${MYSQL_SLAVE1_PORT}
      - MYSQL_SLAVE1_DATABASE=${GIFT_MYSQL_SLAVE1_DATABASE}
      - MYSQL_SLAVE2_USERNAME=${MYSQL_SLAVE2_USERNAME}
      - MYSQL_SLAVE2_PASSWORD=${MYSQL_SLAVE2_PASSWORD}
      - MYSQL_SLAVE2_HOST=${MYSQL_SLAVE2_HOST}
      - MYSQL_SLAVE2_PORT=${MYSQL_SLAVE2_PORT}
      - MYSQL_SLAVE2_DATABASE=${GIFT_MYSQL_SLAVE2_DATABASE}
      - RABBITMQ_URL=${RABBITMQ_URL}
    networks:
      - etcd-internal
      - mysql-internal
      - redis-internal

  stream-center:
    image: ghcr.io/kouleen/stream-center:latest
    container_name: stream-center
    environment:
      - ETCD_ENDPOINTS=${ETCD_ENDPOINTS}
      - ADDRESS=${STREAM_ADDRESS}
      - REDIS_ADDR=${REDIS_ADDR}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB}
      - MYSQL_USERNAME=${MYSQL_USERNAME}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_DATABASE=${STREAM_MYSQL_DATABASE}
      - MYSQL_SLAVE1_USERNAME=${MYSQL_SLAVE1_USERNAME}
      - MYSQL_SLAVE1_PASSWORD=${MYSQL_SLAVE1_PASSWORD}
      - MYSQL_SLAVE1_HOST=${MYSQL_SLAVE1_HOST}
      - MYSQL_SLAVE1_PORT=${MYSQL_SLAVE1_PORT}
      - MYSQL_SLAVE1_DATABASE=${STREAM_MYSQL_SLAVE1_DATABASE}
      - MYSQL_SLAVE2_USERNAME=${MYSQL_SLAVE2_USERNAME}
      - MYSQL_SLAVE2_PASSWORD=${MYSQL_SLAVE2_PASSWORD}
      - MYSQL_SLAVE2_HOST=${MYSQL_SLAVE2_HOST}
      - MYSQL_SLAVE2_PORT=${MYSQL_SLAVE2_PORT}
      - MYSQL_SLAVE2_DATABASE=${STREAM_MYSQL_SLAVE2_DATABASE}
