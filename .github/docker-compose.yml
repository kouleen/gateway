    environment:
      - ETCD_ENDPOINTS=${ETCD_ENDPOINTS}
      - ADDRESS=${PAYMENT_ADDRESS}
      - REDIS_ADDR=${REDIS_ADDR}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB}
      - MYSQL_USERNAME=${MYSQL_USERNAME}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_DATABASE=${PAYMENT_MYSQL_DATABASE}
      - MYSQL_SLAVE1_USERNAME=${MYSQL_SLAVE1_USERNAME}
      - MYSQL_SLAVE1_PASSWORD=${MYSQL_SLAVE1_PASSWORD}
      - MYSQL_SLAVE1_HOST=${MYSQL_SLAVE1_HOST}
      - MYSQL_SLAVE1_PORT=${MYSQL_SLAVE1_PORT}
      - MYSQL_SLAVE1_DATABASE=${PAYMENT_MYSQL_SLAVE1_DATABASE}
      - MYSQL_SLAVE2_USERNAME=${MYSQL_SLAVE2_USERNAME}
      - MYSQL_SLAVE2_PASSWORD=${MYSQL_SLAVE2_PASSWORD}
      - MYSQL_SLAVE2_HOST=${MYSQL_SLAVE2_HOST}
      - MYSQL_SLAVE2_PORT=${MYSQL_SLAVE2_PORT}
      - MYSQL_SLAVE2_DATABASE=${PAYMENT_MYSQL_SLAVE2_DATABASE}
      - RABBITMQ_URL=${RABBITMQ_URL}
    networks:
      - etcd-internal
      - mysql-internal
      - redis-internal

  guild-center:
    image: ghcr.io/kouleen/guild-center:latest
    container_name: guild-center
    environment:
      - ETCD_ENDPOINTS=${ETCD_ENDPOINTS}
      - ADDRESS=${GUILD_ADDRESS}
      - REDIS_ADDR=${REDIS_ADDR}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB}
      - MYSQL_USERNAME=${MYSQL_USERNAME}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_DATABASE=${GUILD_MYSQL_DATABASE}
      - MYSQL_SLAVE1_USERNAME=${MYSQL_SLAVE1_USERNAME}
      - MYSQL_SLAVE1_PASSWORD=${MYSQL_SLAVE1_PASSWORD}
      - MYSQL_SLAVE1_HOST=${MYSQL_SLAVE1_HOST}
      - MYSQL_SLAVE1_PORT=${MYSQL_SLAVE1_PORT}
      - MYSQL_SLAVE1_DATABASE=${GUILD_MYSQL_SLAVE1_DATABASE}
      - MYSQL_SLAVE2_USERNAME=${MYSQL_SLAVE2_USERNAME}
      - MYSQL_SLAVE2_PASSWORD=${MYSQL_SLAVE2_PASSWORD}
      - MYSQL_SLAVE2_HOST=${MYSQL_SLAVE2_HOST}
      - MYSQL_SLAVE2_PORT=${MYSQL_SLAVE2_PORT}
      - MYSQL_SLAVE2_DATABASE=${GUILD_MYSQL_SLAVE2_DATABASE}
      - RABBITMQ_URL=${RABBITMQ_URL}
